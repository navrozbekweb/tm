<!DOCTYPE html>
<html lang="uz" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <!-- viewport: Bootstrap responsive ishlashi uchun SHART -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self' file: https://cdn.jsdelivr.net; style-src 'self' file: 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' file: https://cdn.jsdelivr.net; img-src 'self' file: data:; base-uri 'none'; form-action 'self'">
  <title>Kirish — TaskManager</title>
  <style>html{visibility:hidden}</style>
  <!-- Bootstrap 5.3 va Bootstrap Icons (CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Faqat kichik qoʻshimcha uslublar -->
  <link href="css/custom.css" rel="stylesheet">
  <script src="js/auth.js"></script>
</head>
<body class="auth-bg d-flex flex-column min-vh-100" data-page="login">
  <header class="container-fluid py-3 d-flex justify-content-between align-items-center">
    <a class="d-flex align-items-center gap-2 fw-semibold text-decoration-none text-body" href="index.html"><span class="brand-mark"><i class="bi bi-check2-all"></i></span> TaskManager</a>
    <button type="button" class="btn btn-outline-secondary js-theme" data-bs-toggle="tooltip" data-bs-placement="bottom" data-bs-title="Mavzuni almashtirish" aria-label="Mavzuni almashtirish"><i class="bi bi-moon-stars js-theme-icon"></i></button>
  </header>

  <main class="flex-grow-1 d-flex align-items-center py-4">
    <div class="container">
      <div class="row justify-content-center">
        <!-- Responsive ustun: xs 100%, sm 83%, md 67%, lg 42%, xl 33% -->
        <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
          <div class="card shadow border-0">
            <div class="card-body p-4 p-md-5">
              <div class="text-center mb-4">
                <h1 class="h4 fw-bold mb-1">Hisobingizga kiring</h1>
                <p class="text-body-secondary mb-0">Vazifalaringizni davom ettirish uchun kiring.</p>
              </div>
              <form id="authForm" class="vstack gap-3" novalidate>
                <div class="alert alert-danger d-flex align-items-center py-2 mb-0" id="formAlert" role="alert" hidden>
                  <i class="bi bi-exclamation-circle me-2"></i><span id="formAlertText"></span>
                </div>
                <div class="input-group has-validation">
                  <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                  <div class="form-floating">
                    <input type="email" class="form-control" id="email" name="email" placeholder="siz@misol.uz" autocomplete="email" required>
                    <label for="email">Email</label>
                  </div>
                  <div class="invalid-feedback">Email manzilini toʻgʻri kiriting.</div>
                </div>
                <div class="input-group has-validation">
                  <span class="input-group-text"><i class="bi bi-lock"></i></span>
                  <div class="form-floating">
                    <input type="password" class="form-control" id="password" name="password" placeholder="Parol" autocomplete="current-password" required>
                    <label for="password">Parol</label>
                  </div>
                  <button class="btn btn-outline-secondary" type="button" data-toggle-password="#password" aria-label="Parolni koʻrsatish"><i class="bi bi-eye"></i></button>
                  <div class="invalid-feedback">Parolni kiriting.</div>
                </div>
                <button type="submit" class="btn btn-primary btn-lg" id="submitBtn">
                  <span class="spinner-border spinner-border-sm me-2" id="spinner" aria-hidden="true" hidden></span>Kirish
                </button>
              </form>
            </div>
          </div>
          <p class="text-center text-body-secondary mt-4">Hisobingiz yoʻqmi? <a href="register.html" class="fw-semibold">Roʻyxatdan oʻting</a></p>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/authpage.js"></script>
</body>
</html>
